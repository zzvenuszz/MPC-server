  #     - mcp-network
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 30s
  #     timeout: 3s
  #     retries: 3

# Volumes
volumes:
  workspace:
    driver: local
  paper-server:
    driver: local
  # redis-data:
  #   driver: local

# Networks
networks:
  mcp-network:
    driver: bridge
    name: mcp-programming-network